<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Cliente - Canchas Sintéticas</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="logo">⚽ CANCHAS SINTÉTICAS</a>
        <div>
            <a href="index.html">Ver canchas</a>
            <a href="registro_cliente.html">Crear cuenta</a>
        </div>
    </nav>

    <div class="form-card">
        <h2>Iniciar Sesión - Cliente</h2>
        <p style="text-align:center; font-size:0.85rem; color:#666; margin-bottom:1rem;">Acceso para reservar canchas</p>

        <div id="msg"></div>

        <form onsubmit="loginCliente(event)">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="juan@email.com" required>
            </div>
            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary">Entrar</button>
        </form>

        <div class="link">
            ¿No tienes cuenta? <a href="registro_cliente.html">Regístrate aquí</a><br>
            <small>🔒 Los clientes no pueden acceder al panel de administración</small><br>
            <small><a href="login_admin.html">Acceso exclusivo Administradores →</a></small>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/auth_cliente.js"></script>
</body>
</html>
