<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Cliente - Canchas Sintéticas</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="logo">⚽ CANCHAS SINTÉTICAS</a>
        <div>
            <a href="index.html">Ver canchas</a>
            <a href="login_cliente.html">¿Ya tienes cuenta? Inicia sesión</a>
        </div>
    </nav>

    <div class="form-card">
        <h2>Crear cuenta de Cliente</h2>
        <p style="text-align:center; font-size:0.85rem; color:#666; margin-bottom:1rem;">Registro independiente solo para clientes</p>

        <div id="msg"></div>

        <form onsubmit="registrarCliente(event)">
            <div class="form-group">
                <label>Nombre completo</label>
                <input type="text" id="nombre" placeholder="Juan Pérez" required>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="juan@email.com" required>
            </div>
            <div class="form-group">
                <label>Teléfono (opcional)</label>
                <input type="tel" id="telefono" placeholder="3001234567">
            </div>
            <div class="form-group">
                <label>Contraseña (mín 6 caracteres)</label>
                <input type="password" id="password" placeholder="••••••••" required minlength="6">
            </div>
            <button type="submit" class="btn btn-primary">Registrarme</button>
        </form>

        <div class="link">
            ¿Ya tienes cuenta? <a href="login_cliente.html">Inicia sesión aquí</a><br>
            <small><a href="login_admin.html">¿Eres administrador? Ingresa aquí (acceso exclusivo)</a></small>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/auth_cliente.js"></script>
</body>
</html>
